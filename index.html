    <script>
      const path = window.location.pathname;
      const hasSearch = new URLSearchParams(window.location.search).has("q");
      const noindexPrefixes = [
        "/cart",
        "/checkout",
        "/account",
        "/login",
        "/wishlist",
        "/tracking",
        "/ops-console-7f2k9x"
      ];
      if (hasSearch || noindexPrefixes.some((prefix) => path === prefix || path.startsWith(prefix + "/"))) {
        document.querySelector('meta[name="robots"]')?.setAttribute("content", "noindex, follow");
      }
    </script>
