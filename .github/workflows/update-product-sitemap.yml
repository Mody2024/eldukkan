name: Update product sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const siteUrl = 'https://eldukkan.vercel.app';
          const supabaseUrl = (process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const anonKey = process.env.SUPABASE_ANON_KEY || '';

          if (!supabaseUrl || !anonKey) {
            throw new Error('Missing SUPABASE_URL or SUPABASE_ANON_KEY GitHub secrets.');
          }

          const endpoint = new URL('/rest/v1/products', supabaseUrl);
          endpoint.searchParams.set('select', 'id,name,description,category,price,sale_price,stock,image_url,updated_at,created_at');
          endpoint.searchParams.set('is_active', 'eq.true');
          endpoint.searchParams.set('order', 'created_at.desc');
          endpoint.searchParams.set('limit', '5000');

          const response = await fetch(endpoint, {
            headers: {
              apikey: anonKey,
              Authorization: `Bearer ${anonKey}`,
            },
          });

          if (!response.ok) {
            throw new Error(`Supabase returned HTTP ${response.status}`);
          }

          const products = await response.json();

          const latestReviewByProduct = new Map();
          const reviewEndpoint = new URL('/rest/v1/reviews', supabaseUrl);
          reviewEndpoint.searchParams.set('select', 'product_id,created_at');
          reviewEndpoint.searchParams.set('limit', '10000');

          const reviewResponse = await fetch(reviewEndpoint, {
            headers: {
              apikey: anonKey,
              Authorization: `Bearer ${anonKey}`,
            },
          });

          if (reviewResponse.ok) {
            const reviews = await reviewResponse.json();
            for (const review of reviews) {
              if (!review?.product_id || !review?.created_at) continue;
              const current = latestReviewByProduct.get(review.product_id);
              if (!current || new Date(review.created_at) > new Date(current)) {
                latestReviewByProduct.set(review.product_id, review.created_at);
              }
            }
          } else {
            console.warn(`Reviews request returned HTTP ${reviewResponse.status}; continuing with product timestamps only.`);
          }

          const escapeXml = (value) =>
            String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&apos;');

          const categoryLastMods = new Map();

          for (const product of products) {
            if (!product?.category) continue;
            const current = categoryLastMods.get(product.category);
            const candidate = product.updated_at || product.created_at || undefined;
            if (!current || (candidate && new Date(candidate) > new Date(current))) {
              categoryLastMods.set(product.category, candidate);
            }
          }

          const categoryUrls = [...categoryLastMods.entries()]
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([category, lastmod]) => ({
              loc: `${siteUrl}/category/${encodeURIComponent(category)}`,
              lastmod,
            }));

          const urls = [
            { loc: siteUrl + '/' },
            ...categoryUrls,
            ...products
              .filter((product) => product && product.id)
              .map((product) => ({
                loc: `${siteUrl}/product/${encodeURIComponent(product.id)}`,
                lastmod: [product.updated_at || product.created_at, latestReviewByProduct.get(product.id)]
                  .filter(Boolean)
                  .sort((a, b) => new Date(b) - new Date(a))[0] || undefined,
                image: product.image_url || undefined,
              })),
          ];

          const xml = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:image="http://www.google.com/schemas/sitemap-image/1.1">',
            ...urls.map(({ loc, lastmod, image }) =>
              `  <url><loc>${escapeXml(loc)}</loc>${lastmod ? `<lastmod>${new Date(lastmod).toISOString()}</lastmod>` : ''}${image ? `<image:image><image:loc>${escapeXml(image)}</image:loc></image:image>` : ''}</url>`
            ),
            '</urlset>',
            '',
          ].join('\n');

          fs.mkdirSync('public', { recursive: true });
          fs.writeFileSync('public/sitemap.xml', xml);

          const feedItems = products
            .filter((product) => product && product.id && product.name && product.image_url)
            .map((product) => {
              const regularPrice = Number(product.price);
              const currentPrice = Number(product.sale_price || product.price);
              const availability = Number(product.stock ?? 1) <= 0 ? 'out_of_stock' : 'in_stock';
              const productUrl = siteUrl + '/product/' + encodeURIComponent(product.id);
              return [
                '    <item>',
                '      <g:id>' + escapeXml(product.id) + '</g:id>',
                '      <g:title>' + escapeXml(product.name) + '</g:title>',
                '      <g:description>' + escapeXml(product.description || product.name) + '</g:description>',
                '      <g:link>' + escapeXml(productUrl) + '</g:link>',
                '      <g:image_link>' + escapeXml(product.image_url) + '</g:image_link>',
                '      <g:availability>' + availability + '</g:availability>',
                '      <g:condition>new</g:condition>',
                '      <g:price>' + regularPrice.toFixed(2) + ' EGP</g:price>',
                ...(product.sale_price && currentPrice < regularPrice ? ['      <g:sale_price>' + currentPrice.toFixed(2) + ' EGP</g:sale_price>'] : []),
                ...(product.category ? ['      <g:product_type>' + escapeXml(product.category) + '</g:product_type>'] : []),
                '    </item>',
              ].join('\n');
            })
            .join('\n');

          const feed = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<rss version="2.0" xmlns:g="http://base.google.com/ns/1.0">',
            '  <channel>',
            '    <title>ElDukkan Product Feed</title>',
            '    <link>' + siteUrl + '/</link>',
            '    <description>ElDukkan products available online in Egypt.</description>',
            feedItems,
            '  </channel>',
            '</rss>',
            '',
          ].join('\n');

          fs.writeFileSync('public/google-products.xml', feed);
          console.log('Generated sitemap with ' + urls.length + ' URLs and Google product feed with ' + products.length + ' products.');
          NODE

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- public/sitemap.xml public/google-products.xml; then
            echo "Sitemap unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml public/google-products.xml
          git commit -m "chore: update product sitemap [skip ci]"
          git push
